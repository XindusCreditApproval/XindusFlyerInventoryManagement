<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyer Inventory & Distribution Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-4xl mx-auto p-6">
    <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow-sm border border-slate-200">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Flyer Inventory Tracker</h1>
        <p class="text-xs text-slate-500">Delhi (Hub) | Surat | Jaipur</p>
      </div>
      <div id="user-info" class="text-sm font-medium text-blue-600">Active Session</div>
    </header>

    <!-- Stock Dashboard -->
    <section class="mb-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">Current Stock Levels</h2>
        <button onclick="loadInventory()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded">Refresh Stock</button>
      </div>
      <div id="stock-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="col-span-3 text-slate-400 text-sm">Loading stock data...</div>
      </div>
    </section>

    <!-- Action Forms -->
    <section class="bg-white p-6 rounded-lg shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-4">Record Transaction</h2>
      
      <form id="tx-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Transaction Type</label>
          <select id="tx-type" class="w-full border rounded p-2 text-sm bg-white" onchange="toggleFields()">
            <option value="OUTWARD_CUSTOMER">Customer Distribution</option>
            <option value="INWARD_VENDOR">Vendor Inward (Delhi Hub)</option>
            <option value="TRANSFER_OUT">Branch Transfer (Delhi -> Branch)</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Flyer Type</label>
            <select id="flyer-type" class="w-full border rounded p-2 text-sm bg-white">
              <option value="1kg">1kg Flyer</option>
              <option value="2kg">2kg Flyer</option>
              <option value="3kg">3kg Flyer</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Quantity *</label>
            <input type="number" id="qty" min="1" class="w-full border rounded p-2 text-sm" placeholder="e.g. 50" required />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">City / Branch</label>
          <select id="src-city" class="w-full border rounded p-2 text-sm bg-white">
            <option value="Delhi">Delhi (Main Hub)</option>
            <option value="Surat">Surat</option>
            <option value="Jaipur">Jaipur</option>
          </select>
        </div>

        <div id="field-vendor" class="hidden">
          <label class="block text-sm font-medium mb-1">Vendor Name</label>
          <input type="text" id="vendor-name" class="w-full border rounded p-2 text-sm" placeholder="Vendor Name" />
        </div>

        <div id="field-customer">
          <label class="block text-sm font-medium mb-1">Customer ID *</label>
          <input type="text" id="customer-id" class="w-full border rounded p-2 text-sm" placeholder="e.g. CUST-10492" required />
        </div>

        <div id="field-transfer" class="hidden">
          <label class="block text-sm font-medium mb-1">Destination Branch</label>
          <select id="dest-city" class="w-full border rounded p-2 text-sm bg-white">
            <option value="Surat">Surat</option>
            <option value="Jaipur">Jaipur</option>
          </select>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-2.5 rounded hover:bg-blue-700 font-semibold text-sm transition-colors">
          Submit Transaction
        </button>
      </form>
    </section>
  </div>

  <script>
    const SUPABASE_URL = 'https://mhvxlgqkfxghpkjfvude.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_jOedpjipxRUlzsisHe1yqg_4gWCjqNM';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadInventory() {
      const grid = document.getElementById('stock-grid');
      const { data: inventory, error } = await supabase.from('inventory').select('*').order('city');

      if (error || !inventory || inventory.length === 0) {
        grid.innerHTML = `<div class="col-span-3 text-red-500 text-sm">Failed to load stock. Run initial SQL query in Supabase.</div>`;
        return;
      }

      grid.innerHTML = '';
      inventory.forEach(item => {
        grid.innerHTML += `
          <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${item.city}</span>
            <div class="text-lg font-bold mt-2 text-slate-800">${item.flyer_type} Flyer</div>
            <div class="text-sm text-slate-500 mt-1">Available: <span class="font-bold text-blue-600">${item.quantity}</span> units</div>
          </div>
        `;
      });
    }

    function toggleFields() {
      const type = document.getElementById('tx-type').value;
      const custField = document.getElementById('customer-id');
      
      document.getElementById('field-vendor').classList.toggle('hidden', type !== 'INWARD_VENDOR');
      document.getElementById('field-customer').classList.toggle('hidden', type !== 'OUTWARD_CUSTOMER');
      document.getElementById('field-transfer').classList.toggle('hidden', type !== 'TRANSFER_OUT');

      if (type === 'OUTWARD_CUSTOMER') {
        custField.setAttribute('required', 'required');
      } else {
        custField.removeAttribute('required');
      }
    }

    document.getElementById('tx-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing...';

      const type = document.getElementById('tx-type').value;
      const flyer = document.getElementById('flyer-type').value;
      const qty = parseInt(document.getElementById('qty').value);
      const srcCity = document.getElementById('src-city').value;
      const vendor = document.getElementById('vendor-name').value;
      const customerId = document.getElementById('customer-id').value;
      const destCity = document.getElementById('dest-city').value;

      try {
        // Direct Inventory Update Mechanism
        if (type === 'INWARD_VENDOR') {
          const { data: curr } = await supabase.from('inventory').select('quantity').eq('city', 'Delhi').eq('flyer_type', flyer).single();
          const newQty = (curr ? curr.quantity : 0) + qty;
          await supabase.from('inventory').update({ quantity: newQty }).eq('city', 'Delhi').eq('flyer_type', flyer);
        } else if (type === 'OUTWARD_CUSTOMER') {
          const { data: curr } = await supabase.from('inventory').select('quantity').eq('city', srcCity).eq('flyer_type', flyer).single();
          const newQty = Math.max(0, (curr ? curr.quantity : 0) - qty);
          await supabase.from('inventory').update({ quantity: newQty }).eq('city', srcCity).eq('flyer_type', flyer);
        } else if (type === 'TRANSFER_OUT') {
          const { data: srcCurr } = await supabase.from('inventory').select('quantity').eq('city', 'Delhi').eq('flyer_type', flyer).single();
          const { data: destCurr } = await supabase.from('inventory').select('quantity').eq('city', destCity).eq('flyer_type', flyer).single();
          
          await supabase.from('inventory').update({ quantity: Math.max(0, (srcCurr ? srcCurr.quantity : 0) - qty) }).eq('city', 'Delhi').eq('flyer_type', flyer);
          await supabase.from('inventory').update({ quantity: (destCurr ? destCurr.quantity : 0) + qty }).eq('city', destCity).eq('flyer_type', flyer);
        }

        // Save transaction history
        await supabase.from('transactions').insert([{
          transaction_type: type,
          flyer_type: flyer,
          quantity: qty,
          source_city: srcCity,
          destination_city: type === 'TRANSFER_OUT' ? destCity : null,
          vendor_name: type === 'INWARD_VENDOR' ? vendor : null,
          customer_id: type === 'OUTWARD_CUSTOMER' ? customerId : null
        }]);

        alert('✅ SUCCESS: Transaction recorded successfully!');
        document.getElementById('tx-form').reset();
        toggleFields();
        loadInventory();
      } catch (err) {
        alert('❌ ERROR: ' + err.message);
      }

      submitBtn.disabled = false;
      submitBtn.innerText = 'Submit Transaction';
    });

    loadInventory();
  </script>
</body>
</html>
